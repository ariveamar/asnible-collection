- name: "Play 1 | Run connectivity checks on {{ inventory_hostname }}"
  hosts: '{{ check_source }}'
  gather_facts: false
 
  vars_files:
    - vars/targets.yml
 
  tasks:
 
    # ----------------------------------------------------------
    # 0. Timestamp
    # ----------------------------------------------------------
    - name: Collect current timestamp
      ansible.builtin.shell:
        cmd: date -u +"%Y-%m-%dT%H:%M:%SZ"
        executable: /bin/bash
      register: ts_raw
      changed_when: false
 
    - name: Set report timestamp fact
      ansible.builtin.set_fact:
        report_ts: "{{ ts_raw.stdout | trim }}"
 
 
    # ----------------------------------------------------------
    # 2. TCP PORT CHECK – run from this host to each target:port
    # ----------------------------------------------------------
    - name: "PORT | {{ inventory_hostname }} → {{ item.0.alias }}:{{ item.1 }}"
      ansible.builtin.wait_for:
        host: "{{ item.0.hostname }}"
        port: "{{ item.1 }}"
        timeout: "{{ port_check_timeout }}"
        state: started
      register: port_raw
      loop: "{{ check_targets | subelements('ports') }}"
      loop_control:
        label: "{{ item.0.alias }}:{{ item.1 }}"
      ignore_errors: true
 
    - name: Build port result facts
      ansible.builtin.set_fact:
        port_results: >-
          {{
            port_results | default([]) + [{
              'target_alias': item.item.0.alias,
              'target_host':  item.item.0.hostname,
              'port':         item.item.1,
              'status':       ('OPEN' if not item.failed else 'CLOSED'),
              'detail':       ('' if not item.failed else 'connection refused or timeout')
            }]
          }}
      loop: "{{ port_raw.results }}"
      loop_control:
        label: "{{ item.item.0.alias }}:{{ item.item.1 }}"
 
    # ----------------------------------------------------------
    # 3. SUMMARY STATS
    # ----------------------------------------------------------
    - name: Compute summary statistics
      ansible.builtin.set_fact:
        stat_port_total:  "{{ port_results | length }}"
        stat_port_open:   "{{ port_results | selectattr('status', 'equalto', 'OPEN')   | list | length }}"
        stat_port_closed: "{{ port_results | selectattr('status', 'equalto', 'CLOSED') | list | length }}"
 
    # ----------------------------------------------------------
    # 4. CONSOLE SUMMARY (on target host)
    # ----------------------------------------------------------
    - name: Print connectivity summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - " CONNECTIVITY CHECK SUMMARY"
          - " Source : {{ inventory_hostname }}"
          - " Time   : {{ report_ts }}"
          - "============================================"
          - "Ports : {{ stat_port_open }}/{{ stat_port_total }} OPEN ({{ stat_port_closed }} CLOSED)"
          - "============================================"

# ==============================================================
# PLAY 2 – Publish report from localhost
# ==============================================================
- name: "Play 2 | Publish report to Mattermost and Confluence"
  hosts: localhost
  connection: local
  gather_facts: false
 
  vars_files:
    - vars/targets.yml
 
  vars:
    _src:             "{{ hostvars[groups['check_source'][0]] }}"
    report_ts:        "{{ _src.report_ts }}"
    port_results:     "{{ _src.port_results }}"
    source_host:      "{{ groups['check_source'][0] }}"
    stat_port_total:  "{{ _src.stat_port_total }}"
    stat_port_open:   "{{ _src.stat_port_open }}"
    stat_port_closed: "{{ _src.stat_port_closed }}"
 
  tasks:
 
    # ----------------------------------------------------------
    # 4. BUILD MATTERMOST MESSAGE
    # ----------------------------------------------------------
    - name: Build Mattermost port table rows
      ansible.builtin.set_fact:
        mm_port_rows: >-
          {{
            mm_port_rows | default('') +
            '| ' + item.target_alias + ' | ' + item.target_host + ' | ' +
            (item.port | string) + ' | ' +
            (':white_check_mark: OPEN' if item.status == 'OPEN' else ':x: CLOSED') +
            ' | ' + item.detail + ' |\n'
          }}
      loop: "{{ port_results }}"
      loop_control:
        label: "{{ item.target_alias }}:{{ item.port }}"
 
    - name: Assemble Mattermost message
      ansible.builtin.set_fact:
        mm_message: |
          ### :satellite: TCP Port Connectivity Check Report
          **Timestamp:** {{ report_ts }}
          **Source host:** `{{ source_host }}`
          **Ports:** {{ stat_port_open }}/{{ stat_port_total }} OPEN &nbsp;|&nbsp; {{ stat_port_closed }} CLOSED
 
          ---
 
          #### :electric_plug: TCP Port Results ({{ stat_port_open }}/{{ stat_port_total }} OPEN)
          | Target | Hostname | Port | Status | Detail |
          |--------|----------|------|--------|--------|
          {{ mm_port_rows | trim }}
 
    - name: Send report to Mattermost
      community.general.mattermost:
        url: "{{ mattermost_url }}"
        api_key: "{{ mattermost_token }}"
        channel_id: "{{ mattermost_channel }}"
        text: "{{ mm_message }}"
        username: "{{ mattermost_username }}"
        icon_url: "{{ mattermost_icon_url }}"
