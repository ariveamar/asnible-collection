- name: "Play 1 | Run connectivity checks on {{ inventory_hostname }}"
  hosts: '{{ check_source }}'
  gather_facts: false
 
  vars_files:
    - vars/targets.yml
 
  tasks:
 
    # ----------------------------------------------------------
    # 0. Timestamp
    # ----------------------------------------------------------
    - name: Collect current timestamp
      ansible.builtin.shell:
        cmd: date -u +"%Y-%m-%dT%H:%M:%SZ"
        executable: /bin/bash
      register: ts_raw
      changed_when: false
 
    - name: Set report timestamp fact
      ansible.builtin.set_fact:
        report_ts: "{{ ts_raw.stdout | trim }}"
 
 
    # ----------------------------------------------------------
    # 2. TCP PORT CHECK – run from this host to each target:port
    # ----------------------------------------------------------
    - name: "PORT | {{ inventory_hostname }} → {{ item.0.alias }}:{{ item.1 }}"
      ansible.builtin.wait_for:
        host: "{{ item.0.hostname }}"
        port: "{{ item.1 }}"
        timeout: "{{ port_check_timeout }}"
        state: started
      register: port_raw
      loop: "{{ check_targets | subelements('ports') }}"
      loop_control:
        label: "{{ item.0.alias }}:{{ item.1 }}"
      ignore_errors: true
 
    - name: Build port result facts
      ansible.builtin.set_fact:
        port_results: >-
          {{
            port_results | default([]) + [{
              'target_alias': item.item.0.alias,
              'target_host':  item.item.0.hostname,
              'port':         item.item.1,
              'status':       ('OPEN' if not item.failed else 'CLOSED'),
              'detail':       ('' if not item.failed else 'connection refused or timeout')
            }]
          }}
      loop: "{{ port_raw.results }}"
      loop_control:
        label: "{{ item.item.0.alias }}:{{ item.item.1 }}"
 
    # ----------------------------------------------------------
    # 3. SUMMARY STATS
    # ----------------------------------------------------------
    - name: Compute summary statistics
      ansible.builtin.set_fact:
        stat_port_total:  "{{ port_results | length }}"
        stat_port_open:   "{{ port_results | selectattr('status', 'equalto', 'OPEN')   | list | length }}"
        stat_port_closed: "{{ port_results | selectattr('status', 'equalto', 'CLOSED') | list | length }}"
 
    # ----------------------------------------------------------
    # 4. CONSOLE SUMMARY (on target host)
    # ----------------------------------------------------------
    - name: Print connectivity summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - " CONNECTIVITY CHECK SUMMARY"
          - " Source : {{ inventory_hostname }}"
          - " Time   : {{ report_ts }}"
          - "============================================"
          - "Ports : {{ stat_port_open }}/{{ stat_port_total }} OPEN ({{ stat_port_closed }} CLOSED)"
          - "============================================"
